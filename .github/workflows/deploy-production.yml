name: Deploy to Production Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    environment: production
    env:
      # GitHub Pages uses /aina-web-page/. Production is served at the domain root.
      VITE_PUBLIC_BASE: /

    steps:
      - name: Check deployment configuration
        env:
          PROD_FTP_HOST: ${{ secrets.PROD_FTP_HOST }}
          PROD_FTP_USERNAME: ${{ secrets.PROD_FTP_USERNAME }}
          PROD_FTP_PASSWORD: ${{ secrets.PROD_FTP_PASSWORD }}
          PROD_FTP_PORT: ${{ secrets.PROD_FTP_PORT }}
          PROD_FTP_PROTOCOL: ${{ secrets.PROD_FTP_PROTOCOL }}
          PROD_FTP_SERVER_DIR: ${{ secrets.PROD_FTP_SERVER_DIR }}
        run: |
          missing=0
          for key in PROD_FTP_HOST PROD_FTP_USERNAME PROD_FTP_PASSWORD PROD_FTP_PORT PROD_FTP_PROTOCOL PROD_FTP_SERVER_DIR; do
            if [ -z "${!key}" ]; then
              echo "::error title=Missing production secret::$key is not configured."
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production site
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

      - name: Upload production artifact
        uses: actions/upload-artifact@v6
        with:
          name: aina-production-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy static files
        env:
          DEPLOY_HOST: ${{ secrets.PROD_FTP_HOST }}
          DEPLOY_USERNAME: ${{ secrets.PROD_FTP_USERNAME }}
          DEPLOY_PASSWORD: ${{ secrets.PROD_FTP_PASSWORD }}
          DEPLOY_PORT: ${{ secrets.PROD_FTP_PORT }}
          DEPLOY_PROTOCOL: ${{ secrets.PROD_FTP_PROTOCOL }}
          DEPLOY_REMOTE_DIR: ${{ secrets.PROD_FTP_SERVER_DIR }}
          DEPLOY_LOCAL_DIR: ./dist
        run: bash ./scripts/deploy-via-lftp.sh
